name: ci

on:
  push:
    branches: [main]
  pull_request:

# head_ref is set only on pull requests: a PR's older run is cancelled when it is updated,
# and every push to main gets its own group, so a main run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Load the netem qdisc module
        run: sudo modprobe sch_netem && lsmod | grep sch_netem
      - name: Check
        run: ./check.sh
      - name: Keep the smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results
          # only what this run wrote: results/ also holds 16 MB of committed data
          path: results/*-smoke/
          retention-days: 14
